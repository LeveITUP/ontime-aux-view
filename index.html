<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ontime Aux Timers</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="status" class="status status--connecting" title="Connection status">
      <span class="status__dot"></span>
      <span class="status__label">Connecting…</span>
    </div>

    <main class="stage">
      <!-- Aux timer cards are generated by app.js -->
    </main>

    <!-- SVG template for a single aux timer ring -->
    <template id="aux-card-template">
      <section class="aux" data-playback="stop">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring__fill" cx="100" cy="100" r="90" />
          <circle class="ring__track" cx="100" cy="100" r="90" />
          <circle class="ring__progress" cx="100" cy="100" r="90" pathLength="100" />
          <circle class="ring__outline ring__outline--outer" cx="100" cy="100" />
          <circle class="ring__outline ring__outline--inner" cx="100" cy="100" />
        </svg>
        <div class="aux__center">
          <div class="aux__time">--:--</div>
          <div class="aux__label">Aux</div>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
